<!DOCTYPE html>
<html>
<head>
    <title>Simulated Bank Login</title>
    <link rel="stylesheet" 
    href="{{ url_for('static', filename='css/login.css') }}">
</head>

<body>

    {% include 'navbar.html' %}

    <!-- SECURITY BANNER -->
    <div id="securityBanner" class="security-banner"></div>

    <!-- LOGIN CONTAINER -->
    <div class="login-container">

        <div class="login-box">

            <h2>Bank Login</h2>

            <!-- SSL Indicator -->
            <div id="sslStatus" class="ssl"></div>

            <!-- ERROR MESSAGE -->
            {% if error %}
            <p style="color:red; 
            text-align:center; 
            font-weight:bold;">
                ⚠ {{ error }}
            </p>
            {% endif %}

            <!-- FORM - NO ID, SIMPLE FORM -->
            <form method="POST" action="/login">

                <input type="text" 
                name="username" 
                placeholder="Username" 
                required>

                <input type="password" 
                name="password" 
                placeholder="Password" 
                required>

                <label>
                    <input type="checkbox" name="remember">
                    Remember Me
                </label>

                <button type="submit">Login</button>

            </form>

            <p><a href="/register">Register</a></p>

        </div>
    </div>

    <script src="{{ url_for('static', 
    filename='js/login.js') }}"></script>
    <script src="{{ url_for('static', 
filename='js/loginValidator.js') }}"></script>

</body>
</html>
