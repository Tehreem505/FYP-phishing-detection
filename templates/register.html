<!DOCTYPE html>
<html>
<head>
    <title>Register</title>
    <link rel="stylesheet" 
    href="{{ url_for('static', filename='css/login.css') }}">
</head>

<body>

    {% include 'navbar.html' %}

    <div class="login-container">
        <div class="login-box">

            <h2>Create Account</h2>

            {% if error %}
            <p style="color:red; 
            text-align:center; 
            font-weight:bold;">
                ⚠ {{ error }}
            </p>
            {% endif %}

            {% if success %}
            <p style="color:green; 
            text-align:center; 
            font-weight:bold;">
                ✅ {{ success }}
            </p>
            {% endif %}

            <form method="POST" action="/register">

                <input type="text" 
                name="username" 
                placeholder="Username" 
                required>

                <input type="email" 
                name="email" 
                placeholder="Email" 
                required>

                <input type="password" 
                name="password" 
                placeholder="Password" 
                required>

                <button type="submit">Register</button>

            </form>

            <p>Already have account? 
                <a href="/login">Login here</a>
            </p>

        </div>
    </div>

</body>
</html>
